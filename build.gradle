plugins {
	id 'java'
	id 'java-test-fixtures'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
//	id 'jacoco'
}

bootJar {
	enabled = false
}

repositories {
	mavenCentral()
}

//jacoco {
//	toolVersion = "0.8.12"
//	reportsDirectory = layout.buildDirectory.dir('jacoco')
//}

subprojects {
	group = 'kgu.developers'
	version = '0.0.1-SNAPSHOT'
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17

	apply plugin: 'java'
	apply plugin: "java-test-fixtures"
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'jacoco'

	jacoco {
		toolVersion = "0.8.12"
		reportsDirectory = layout.buildDirectory.dir('jacoco')
	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-data-redis'

		runtimeOnly 'org.postgresql:postgresql'
		implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
		annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
		annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

		implementation 'io.jsonwebtoken:jjwt:0.9.1'
		implementation 'javax.xml.bind:jaxb-api:2.3.1'

		testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
		testFixturesRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		testFixturesImplementation 'org.springframework.boot:spring-boot-starter-security'
		testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		testFixturesImplementation 'org.projectlombok:lombok'
		testFixturesImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

		testFixturesImplementation 'org.jacoco:org.jacoco.agent:0.8.12'
	}

	test {
		useJUnitPlatform()
		dependsOn testFixturesClasses
		finalizedBy 'jacocoTestReport'
	}

	jacocoTestReport {
		dependsOn test
		executionData fileTree(dir: layout.buildDirectory, includes: ["jacoco/test.exec", "jacoco/testFixtures.exec"])
		reports {
			xml.required = true
			csv.required = false
			html.required = true
		}
		afterEvaluate {
			classDirectories.setFrom(files(classDirectories.files.collect {
				fileTree(dir: it, exclude: [
						'**/dto/**',
						'**/event/**',
						'**/*InitData*',
						'**/*Application*',
						'**/exception/**',
						'**/service/alarm/**',
						'**/aop/**',
						'**/config/**',
						'**/MemberRole*'
				] + (('A'..'Z').collect { "Q${it}*" } as Collection<String>))
			}))
		}

		finalizedBy 'jacocoTestCoverageVerification'
	}

	jacocoTestCoverageVerification {
		dependsOn jacocoTestReport
		violationRules {
			rule {
				element = 'CLASS'

				limit {
					counter = 'LINE'
					value = 'COVEREDRATIO'
					minimum = 0.80
				}

				limit {
					counter = 'BRANCH'
					value = 'COVEREDRATIO'
					minimum = 0.80
				}

				excludes = [
						'**.dto.**',
						'**.event.**',
						'**.*InitData*',
						'**.*Application*',
						'**.exception.**',
						'**.service.alarm.**',
						'**.aop.**',
						'**.config.**',
						'**.MemberRole*'
				] + (('A'..'Z').collect { "Q${it}*" } as Collection<String>)
			}
		}
	}

	task jacocoTestFixturesReport(type: JacocoReport) {
		dependsOn testFixturesClasses
		executionData fileTree(dir: layout.buildDirectory, includes: ["jacoco/testFixtures.exec"])
		sourceDirectories.setFrom(files("src/testFixtures/java"))
		classDirectories.setFrom(files("build/classes/java/testFixtures"))
		reports {
			xml.required = true
			html.required = true
		}
	}
}