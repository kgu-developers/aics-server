name: Upload Coverage Reports to Codecov On Pull Request

on:
  pull_request:
    branches:
      - develop

  workflow_run:
    workflows: [ "Jacoco Validation On Pull Request" ]
    types:
      - completed

jobs:
  upload-coverage:
    runs-on: ubuntu-latest
    environment: coverage
    steps:
      - name: Download Jacoco Report Artifacts
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: ./coverage-reports

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: './coverage-reports/**/*.xml'
